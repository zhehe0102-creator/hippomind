[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hippomind"
version = "1.0.0"
description = "A local, evidence-backed memory hub for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "HippoMind contributors"}]
dependencies = ["matplotlib>=3.6"]
# Supported/tested runtimes.  3.13 is the newest CPython the CI matrix proves;
# 3.9 stays the floor (see [tool.ruff] target-version = "py39").
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/zps-31/hippomind"
Repository = "https://github.com/zps-31/hippomind"
Documentation = "https://github.com/zps-31/hippomind/blob/main/docs/DETAILED_GUIDE.md"

[project.scripts]
hippomind = "hippomind.cli:main"

[tool.setuptools.packages.find]
include = ["hippomind", "hippomind.*", "integrations", "integrations.*"]
exclude = ["*.tests", "*.tests.*", "*.test", "*.test.*", "*.__pycache__", "*.__pycache__.*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
# The Atlas console is served from the package itself; without this, a wheel
# install would ship a daemon whose /ui answers 404.
hippomind = ["web/**/*"]
integrations = ["*.md", "*.json", "dsh-plugin/**/*"]

# ---------------------------------------------------------------------------
# Static analysis: incremental ratchet, not a big-bang reformat
# ---------------------------------------------------------------------------
# The repository predates any linter config, so a "everything must be clean"
# gate would fail on ~140 pre-existing findings and tempt people to disable it.
# Instead:
#   * `lint` is the gate: an explicit, high-signal rule set that must stay clean
#     (undefined names, shadowed imports, syntax/whitespace errors, warnings).
#   * `lint-legacy` reports the wide default rule set for visibility only; its
#     current count is pinned in scripts/lint-baseline.txt so new findings in
#     that superset are still caught, while legacy debt cannot grow.
# Neither rule set is allowed to depend on a network install: `scripts/lint.sh`
# skips with a clear message when ruff is absent (CI installs it).

[tool.ruff]
target-version = "py39"
line-length = 120
# exFAT volumes spawn AppleDouble `._foo.py` companions; they are binary junk.
# 2026-10-26: 外来的 muse-manager/ 与 ai-hub/ 已摘出为独立目录
# （/Volumes/移动硬盘/Muse Cockpit 与 /Volumes/移动硬盘/AI Hub），
# 不再位于本仓库内。保留排除项以防历史检出或误拷回来。
extend-exclude = ["*.pyi", "._*", ".git", ".venv", "build", "dist", "output", "tmp", "muse-manager", "ai-hub"]

[tool.ruff.lint]
# E9  syntax/IO errors            F63 assert on tuple
# F7  syntax errors               F82 undefined name (real NameErrors)
# F811 redefinition               F402 import shadowed by loop variable
# E4  import placement            W   trailing whitespace / blank lines
select = ["E4", "E7", "E9", "W", "F63", "F7", "F82", "F811", "F402"]

[tool.ruff.lint.per-file-ignores]
# Test modules deliberately insert the repository root on sys.path before
# importing hippomind, which is an import-after-code by construction.
"tests/**" = ["E402"]

# ---------------------------------------------------------------------------
# Type checking: baseline-locked, opt-in
# ---------------------------------------------------------------------------
# mypy is not a runtime dependency and is not installed on every machine; the
# configured scope is the modules that are already close to typed. Widen it as
# modules get annotated rather than starting a codebase-wide red wall.

[tool.mypy]
python_version = "3.9"
# Package paths (not modules): ledger.py and cli.py were mechanically split
# into mixins/command packages in 2026-10; listing them per-directory means a
# future file move cannot silently drop them from the checked scope.
files = ["hippomind/ledger", "hippomind/schema.py", "hippomind/cli"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = false
check_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
pretty = false
exclude = '(^|/)(tests?|build|dist|output|tmp|\.venv)(/|$)|(^|/)\._'
