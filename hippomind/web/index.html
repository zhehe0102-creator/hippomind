<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2EEE4">
<meta name="description" content="HippoMind Atlas · 记忆图志 — 本地记忆账本的纸本档案馆式控制台">
<title>HippoMind Atlas · 记忆图志</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views-a.css">
<link rel="stylesheet" href="css/views-b.css">
</head>
<body>
<a class="skip-link" href="#view-root">跳到内容</a>

<div id="app" class="app">
  <aside id="rail" class="rail" aria-label="索引栏">
    <a class="brand" href="#/pulse" aria-label="HippoMind Atlas 记忆图志 — 回到脉搏">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M20 33.5c-8.6 0-14-6.2-14-14S11.4 5.5 20 5.5s14 6.2 14 14"/>
          <path d="M20 28.6c-5 0-8.6-4-8.6-9.1S14.9 10.4 20 10.4s8.6 4 8.6 9.1"/>
          <path d="M20 23.6c-2.4 0-4.1-1.9-4.1-4.2s1.7-4.2 4.1-4.2 4.1 1.9 4.1 4.2"/>
        </g>
        <circle class="brand-dot" cx="31.6" cy="10" r="2.6"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">HippoMind Atlas</span>
        <span class="brand-sub">记忆图志</span>
      </span>
    </a>

    <nav id="nav" class="rail-nav" aria-label="视图导航">
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
      <span class="atlas-skeleton nav-skeleton-row" aria-hidden="true"></span>
    </nav>

    <footer class="rail-foot">
      <div class="rail-foot-row"><span>Atlas</span><b>v1.0</b></div>
      <div class="rail-foot-row"><span>Register</span><b><span class="theme-name theme-name--paper">纸本</span><span class="theme-name theme-name--night">夜档</span></b></div>
      <p class="rail-foot-note">本地优先 · 零依赖 · 只读为主</p>
    </footer>
  </aside>

  <div class="workspace">
    <header id="topbar" class="topbar">
      <div class="topbar-title">
        <div id="view-eyebrow" class="topbar-eyebrow">HippoMind Atlas</div>
        <h1 id="view-title">记忆图志</h1>
        <p id="view-subtitle">正在打开本地档案馆…</p>
      </div>
      <div class="topbar-actions">
        <button id="search-trigger" class="topbar-btn" type="button" title="命令面板 (⌘K)" aria-label="打开命令面板">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6"/><path d="M15.4 15.4L21 21"/></svg>
          <span class="topbar-btn-label">搜索</span>
          <kbd>⌘K</kbd>
        </button>
        <button id="refresh-btn" class="topbar-btn" type="button" title="刷新 (R)" aria-label="刷新当前视图">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.5 12a7.5 7.5 0 0112.9-5.2L20 9"/><path d="M20 4.5V9h-4.5"/><path d="M19.5 12a7.5 7.5 0 01-12.9 5.2L4 15"/><path d="M4 19.5V15h4.5"/></svg>
          <span class="topbar-btn-label">刷新</span>
          <kbd>R</kbd>
        </button>
        <button id="theme-btn" class="topbar-btn" type="button" title="切换主题 (T)" aria-label="切换深浅主题">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2"/><path d="M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
          <span class="topbar-btn-label">主题</span>
          <kbd>T</kbd>
        </button>
      </div>
    </header>

    <main id="view-root" class="view-root" tabindex="-1">
      <div class="boot-view" aria-hidden="true">
        <div class="boot-hero">
          <div class="atlas-skeleton atlas-skeleton--title"></div>
          <div class="atlas-skeleton atlas-skeleton--hero"></div>
        </div>
        <div class="boot-grid">
          <div class="atlas-skeleton atlas-skeleton--card"></div>
          <div class="atlas-skeleton atlas-skeleton--card"></div>
          <div class="atlas-skeleton atlas-skeleton--card"></div>
        </div>
        <div class="boot-rows">
          <div class="atlas-skeleton"></div>
          <div class="atlas-skeleton"></div>
          <div class="atlas-skeleton"></div>
        </div>
      </div>
    </main>

    <footer id="statusbar" class="statusbar" aria-label="daemon 状态">
      <span class="statusbar-dot" aria-hidden="true"></span>
      <span class="statusbar-part">daemon <b>正在连接…</b></span>
      <span class="statusbar-spacer"></span>
      <span class="statusbar-hint">1–0 视图 · ⌘K 命令 · R 刷新 · T 主题</span>
    </footer>
  </div>
</div>

<div id="drawer-root"></div>
<div id="palette-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="false"></div>
<div id="connect-root"></div>

<noscript>
  <div class="noscript-note">本控制台需要 JavaScript。若长期禁用，请改用 CLI：<code>hippomind ui --no-open</code> 获取地址后手动打开。</div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
